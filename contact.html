<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower & Bouquet Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
 <style>
  body{
      background:#f9fafb;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;
    }
  
    .navbar {
      background: rgb(107, 108, 108);
    }
    .navbar-brand {
      margin: 10px;
      font-weight: bold;
      font-size: 1.3rem;
    }
    .navbar-nav .nav-link {
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .navbar-nav .nav-link:hover {
      color: #222 !important;
    }
 </style>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        🌸My Flower Shop
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
              data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto text-uppercase">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="Bouquets.html">Bouquets</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="card.html">Cart</a></li>
         <li class="nav-item"><a class="nav-link text-white" href="contact.html">contact as</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <!-- Contact Section -->
  <section class="container py-5" id="contact">
    <h2 class="section-title text-center">Contact Us</h2>

    <div class="d-flex flex-column align-items-center text-center">

      <!-- Contact Info -->
      <div class="mb-4">
        <h5 class="fw-bold mb-2">📍 Address</h5>
        <p>123 Flower Street, Chennai, Tamil Nadu, India</p>

        <h5 class="fw-bold mb-2">📞 Phone</h5>
        <p>+91 98765 43210</p>

        <h5 class="fw-bold mb-2">📧 Email</h5>
        <p>support@myflowershop.com</p>
      </div>

      <!-- Contact Form -->
      <div class="card shadow p-4 w-100" style="max-width: 500px;">
        <form>
          <div class="mb-3 text-start">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" required>
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">Your Email</label>
            <input type="email" class="form-control" placeholder="Enter your email" required>
          </div>
          <div class="mb-3 text-start">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" placeholder="Write your message..." required></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-custom">Send Message</button>
          </div>
        </form>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="text-white text-center py-3">
    <p>&copy; 2025 My Flower Shop | Kokila S</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
